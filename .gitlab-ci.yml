stages:
  - security
  - analysis
  - mirror

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# Secret scan (gitleaks). Runs FIRST, on every branch. If it finds a secret the
# pipeline stops before the `mirror` stage, so a leaked credential never reaches the
# public GitHub mirror. Complements the local Claude Code hook (claude-secret-guard.js),
# which only guards commits made through Claude Code on the author's machine — this
# covers every push and every contributor. Scans this repo's git history; submodule
# file contents live in their own repos and are out of scope (GIT_SUBMODULE_STRATEGY:
# none here overrides the recursive default).
gitleaks:
  stage: security
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH
  variables:
    GIT_SUBMODULE_STRATEGY: none
    # Bump when a newer gitleaks release is out. If the download 404s, this is the line to fix.
    GITLEAKS_VERSION: "8.21.2"
  before_script:
    # git is NOT in alpine:latest, but `gitleaks detect` shells out to it to walk the
    # history — without it the job dies with `could not create Git cmd`.
    - apk add --no-cache curl tar git
    - curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
    - tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
  script:
    - gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1

sonarqube:
  stage: analysis
  image: mcr.microsoft.com/dotnet/sdk:10.0
  rules:
    - if: $CI_COMMIT_BRANCH
  before_script:
    - apt-get update && apt-get install -y unzip
    - curl -L https://goatcorp.github.io/dalamud-distrib/latest.zip -o /tmp/dalamud.zip
    - mkdir -p /tmp/dalamud && unzip -o /tmp/dalamud.zip -d /tmp/dalamud
    - export DALAMUD_HOME=/tmp/dalamud
  script:
    - cp Echokraut/Services/DriveAuthProvider.Secrets.cs.example Echokraut/Services/DriveAuthProvider.Secrets.cs
    - dotnet tool install --global dotnet-sonarscanner
    - export PATH="$PATH:$HOME/.dotnet/tools"
    - dotnet sonarscanner begin /key:"$SONAR_PROJECT_KEY" /d:sonar.host.url="$SONAR_HOST_URL" /d:sonar.token="$SONAR_TOKEN" /d:sonar.exclusions="OtterGui/**,KamiToolKit/**,Echotools/**,EchokrautLocalInstaller/**"
    - dotnet build
    - dotnet test --no-build || true
    - dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

mirror-to-github:
  stage: mirror
  image: alpine/git:latest
  # Snapshot mirror: GitHub only ever sees the CURRENT state of main as a single
  # parentless commit — no development history. Every push replaces that commit.
  #
  # Scope, so nobody expects more than this delivers:
  #   * Only `main` and tag pipelines mirror. Feature branches stay on GitLab.
  #     Branches already present on GitHub from the old full mirror are left alone
  #     (deleting them is a manual, deliberate act).
  #   * The 145 pre-existing tags still point at the OLD full history, so that
  #     history remains reachable on GitHub through them. This job makes future
  #     pushes history-free; it does not retroactively unpublish anything.
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
  variables:
    # Submodule *contents* are irrelevant here — the snapshot commit reuses the
    # checked-out tree, and submodules live in the index as gitlinks either way.
    GIT_SUBMODULE_STRATEGY: none
  script:
    - git config --global user.email "ci@echotools.cloud"
    - git config --global user.name "Echokraut CI"
    # --orphan keeps the index, so committing right away reproduces the exact tree
    # of this pipeline's commit with no parent. No `git add` (that would fight the
    # empty, un-cloned submodule directories).
    - git checkout --orphan snapshot
    - git commit -q -m "Echokraut ${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # Target path is hardcoded — the GitHub repo lives under RenNagasaki, but ${GITHUB_USER}
    # is the CI auth identity and may differ. Using ${GITHUB_USER} on both sides routed the
    # push to the wrong repo and triggered 403s.
    - git remote add github "https://${GITHUB_USER}:${GITHUB_PAT}@github.com/RenNagasaki/Echokraut.git"
    # Force is inherent to the design: each snapshot is unrelated to the last.
    - if [ -n "$CI_COMMIT_BRANCH" ]; then git push github snapshot:main --force; fi
    # Tag pipelines: repoint the tag at the snapshot so a release never drags the
    # full history back onto GitHub. Push stays NON-force, preserving the old rule
    # that an existing GitHub tag (e.g. one cut via the Release UI) is never
    # silently overwritten — a collision has to be resolved by hand.
    - if [ -n "$CI_COMMIT_TAG" ]; then git tag -f "$CI_COMMIT_TAG" && git push github "refs/tags/$CI_COMMIT_TAG"; fi
